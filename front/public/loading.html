<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitora Pet</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101817; color: #eef7f4; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { text-align: center; padding: 2rem; }
      .mark { width: 72px; height: 72px; margin: 0 auto 1.25rem; animation: breathe 2.2s ease-in-out infinite; }
      h1 { margin: 0 0 0.4rem; font-size: 1.4rem; letter-spacing: -0.02em; }
      p { margin: 0; color: #a9c2bc; }
      .bar { width: 168px; height: 3px; margin: 1.5rem auto 0; border-radius: 999px; background: #223733; overflow: hidden; }
      .bar i { display: block; width: 40%; height: 100%; border-radius: 999px; background: #55d6ad; animation: slide 1.4s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .mark, .bar i { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7d9c63" />
            <stop offset="1" stop-color="#47603b" />
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="9.5" fill="url(#tile)" />
        <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
          <path d="M10.5 6.5H6.5V10.5" />
          <path d="M21.5 6.5H25.5V10.5" />
          <path d="M10.5 25.5H6.5V21.5" />
          <path d="M21.5 25.5H25.5V21.5" />
        </g>
        <g fill="#fff" transform="translate(6.63 6.51) scale(0.781)">
          <ellipse cx="4.3" cy="10.6" rx="1.9" ry="2.5" />
          <ellipse cx="9.3" cy="7.3" rx="2.1" ry="2.9" />
          <ellipse cx="14.7" cy="7.3" rx="2.1" ry="2.9" />
          <ellipse cx="19.7" cy="10.6" rx="1.9" ry="2.5" />
          <path d="M12 12.4c-3.1 0-5.6 2.1-5.6 4.6 0 2.1 1.8 3.4 3.7 2.9 1.2-.33 2.6-.33 3.8 0 1.9.5 3.7-.8 3.7-2.9 0-2.5-2.5-4.6-5.6-4.6Z" />
        </g>
      </svg>
      <h1>Iniciando o Monitora Pet</h1>
      <p>Preparando a inteligência local e o serviço de monitoramento…</p>
      <div class="bar" aria-hidden="true"><i></i></div>
    </main>
  </body>
</html>
