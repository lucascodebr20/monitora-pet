<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitora Pet</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #101817; color: #eef7f4; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { text-align: center; padding: 2rem; }
      .mark { width: 52px; height: 52px; margin: 0 auto 1rem; border: 5px solid #27413c; border-top-color: #55d6ad; border-radius: 50%; animation: spin 0.9s linear infinite; }
      h1 { margin: 0 0 0.4rem; font-size: 1.4rem; }
      p { margin: 0; color: #a9c2bc; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>Iniciando o Monitora Pet</h1>
      <p>Preparando a inteligência local e o serviço de monitoramento…</p>
    </main>
  </body>
</html>
