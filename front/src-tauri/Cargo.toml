[package]
name = "monitorapet-desktop"
version = "0.3.2"
description = "Aplicativo desktop local para monitoramento de pets"
authors = ["Monitora Pet"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
