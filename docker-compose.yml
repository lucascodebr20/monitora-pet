services:
  monitorapet:
    build:
      context: .
      dockerfile: Dockerfile
    image: monitorapet:latest
    container_name: monitorapet
    network_mode: host
    environment:
      MONITORAPET_DATA_DIR: /data
      # Hosts pelos quais a interface e acessada, alem de localhost. Vem do
      # .env ao lado deste arquivo, que o deploy nao sobrescreve. Vazio =
      # so o proprio servidor consegue abrir.
      MONITORAPET_ALLOWED_HOSTS: "${MONITORAPET_ALLOWED_HOSTS:-}"
      TZ: America/Sao_Paulo
    volumes:
      - ./app-data:/data
    restart: unless-stopped
