services:
  vigiapet:
    build:
      context: .
      dockerfile: Dockerfile
    image: vigiapet:latest
    container_name: vigiapet
    network_mode: host
    environment:
      VIGIAPET_DATA_DIR: /data
      VIGIAPET_ALLOWED_HOSTS: ""
      TZ: America/Sao_Paulo
    volumes:
      - ./app-data:/data
    restart: unless-stopped
